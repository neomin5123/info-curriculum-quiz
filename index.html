<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CoreLoop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      background: #f6f7f9;
      color: #202124;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 0;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 24px;
    }

    .tabs {
      display: flex;
      gap: 28px;
    }

    .tab {
      padding: 12px 4px;
      border: none;
      background: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      color: #777;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: #111;
      border-bottom-color: #111;
    }

    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .description {
      color: #666;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
    }

    .start-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .placeholder {
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .header-inner {
        padding-top: 18px;
      }

      main {
        margin-top: 20px;
      }

      .panel {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <h1>CoreLoop</h1>

    <nav class="tabs">
      <button
        class="tab active"
        id="generalTab"
        onclick="showTab('general')"
      >
        총론
      </button>

      <button
        class="tab"
        id="subjectTab"
        onclick="showTab('subject')"
      >
        각론
      </button>
    </nav>

  </div>
</header>


<main>

  <!-- 총론 -->
  <section id="generalPage">

    <div class="panel">

      <h2>총론 학습</h2>

      <p class="description">
        국가 교육과정 총론과 정보과 교육과정의 주요 변천 내용을 학습합니다.
        선택한 범위의 문제를 순서대로 모두 풉니다.
      </p>

      <div class="field">

        <label for="generalCategory">
          학습 범위
        </label>

        <select id="generalCategory">

          <option value="all">
            전체
          </option>

          <option value="competency">
            추구하는 인간상 · 핵심역량
          </option>

          <option value="history">
            정보과 교육과정 변천
          </option>

          <option value="hours">
            시수 · 편제
          </option>

          <option value="subjects">
            교과 · 선택과목 변화
          </option>

          <option value="comparison">
            2015 · 2022 개정 비교
          </option>

        </select>

      </div>

      <button class="start-button">
        총론 문제 시작
      </button>

    </div>

  </section>


  <!-- 각론 -->
<section id="subjectPage" class="hidden">

  <div class="panel">

    <h2>각론 학습</h2>

    <p class="description">
      과목, 영역, 학습 항목과 난이도를 선택하여 문제를 풉니다.
    </p>

    <div class="field">
      <label for="subjectSelect">과목</label>

      <select id="subjectSelect">
        <option value="all">전체</option>
        <option value="middle-info">중학교 정보</option>
        <option value="high-info">고등학교 정보</option>
        <option value="ai-basic">인공지능 기초</option>
        <option value="data-science">데이터 과학</option>
        <option value="software-life">소프트웨어와 생활</option>
        <option value="info-science">정보과학</option>
      </select>
    </div>


    <div class="field">
      <label for="unitSelect">영역</label>

      <select id="unitSelect">
        <option value="all">전체</option>
      </select>
    </div>


    <div class="field">
      <label for="contentSelect">출제 항목</label>

      <select id="contentSelect">
  <option value="all">전체</option>
  <option value="content-system">내용 체계</option>
  <option value="achievement">성취기준</option>
</select>
    </div>


    <div class="field">
      <label for="difficultySelect">난이도</label>

      <select id="difficultySelect">
        <option value="all">전체</option>
        <option value="easy">초급</option>
        <option value="normal">중급</option>
        <option value="hard">고급</option>
        <option value="recall">암송</option>
      </select>
    </div>


    <button class="start-button">
      선택 범위 시작
    </button>

    <button
      class="start-button"
      style="
        margin-top: 12px;
        background: white;
        color: #111;
        border: 1px solid #d1d5db;
      "
    >
      완전 랜덤
    </button>

  </div>

</section>
</main>


<script>

  const subjectAreas = {

    "all": [
      "전체"
    ],

    "middle-info": [
      "전체",
      "컴퓨팅 시스템",
      "데이터",
      "알고리즘과 프로그래밍",
      "인공지능",
      "디지털 문화"
    ],

    "high-info": [
      "전체",
      "컴퓨팅 시스템",
      "데이터",
      "알고리즘과 프로그래밍",
      "인공지능",
      "디지털 문화"
    ],

    "ai-basic": [
      "전체",
      "인공지능의 이해",
      "인공지능과 학습",
      "인공지능의 사회적 영향",
      "인공지능 프로젝트"
    ],

    "data-science": [
      "전체",
      "데이터 과학의 이해",
      "데이터 준비와 분석",
      "데이터 모델링과 평가",
      "데이터 과학 프로젝트"
    ],

    "software-life": [
      "전체",
      "세상을 변화시키는 소프트웨어",
      "창작을 지원하는 소프트웨어",
      "현상을 분석하는 소프트웨어",
      "모의 실험하는 소프트웨어",
      "가치를 창출하는 소프트웨어"
    ],

    "info-science": [
      "전체",
      "프로그래밍 설계와 구현",
      "데이터 구조",
      "알고리즘",
      "정보과학 프로젝트"
    ]

  };


  function updateUnits() {

    const subject =
      document.getElementById("subjectSelect").value;

    const unitSelect =
      document.getElementById("unitSelect");

    unitSelect.innerHTML = "";

    subjectAreas[subject].forEach(area => {

      const option =
        document.createElement("option");

      option.value = area;
      option.textContent = area;

      unitSelect.appendChild(option);

    });

  }


  function showTab(tab) {

    const generalPage =
      document.getElementById("generalPage");

    const subjectPage =
      document.getElementById("subjectPage");

    const generalTab =
      document.getElementById("generalTab");

    const subjectTab =
      document.getElementById("subjectTab");


    if (tab === "general") {

      generalPage.classList.remove("hidden");
      subjectPage.classList.add("hidden");

      generalTab.classList.add("active");
      subjectTab.classList.remove("active");

    } else {

      generalPage.classList.add("hidden");
      subjectPage.classList.remove("hidden");

      generalTab.classList.remove("active");
      subjectTab.classList.add("active");

    }

  }


  document.addEventListener(
    "DOMContentLoaded",
    function () {

      const subjectSelect =
        document.getElementById("subjectSelect");

      subjectSelect.addEventListener(
        "change",
        updateUnits
      );

      updateUnits();

    }
  );

</script>

</body>
</html>
