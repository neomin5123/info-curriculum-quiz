<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315e48">
  <meta name="description" content="CurriLoop — 2022 개정 정보과 교육과정 회상·복습 및 정보·컴퓨터 기출 학습">
  <title>CurriLoop</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css?b=20261019-14">
</head>
<body data-build="2026.10.19-14">
  <header class="app-header">
    <div class="brand-row">
      <h1>CurriLoop</h1>
    </div>
    <label class="zoom-control">화면 배율
      <select id="zoomSelect" aria-label="화면 배율">
        <option value="85">85%</option><option value="90">90%</option><option value="100">100%</option><option value="110">110%</option><option value="125">125%</option>
      </select>
    </label>
  </header>

  <main class="app-shell">
    <nav class="main-tabs" role="tablist" aria-label="CurriLoop 주요 화면">
      <button id="studyMainTab" class="main-tab active" role="tab" aria-selected="true" aria-controls="studyPage">학습</button>
      <button id="reviewMainTab" class="main-tab" role="tab" aria-selected="false" aria-controls="reviewPage">복습</button>
      <button id="examMainTab" class="main-tab" role="tab" aria-selected="false" aria-controls="examPage">기출문제</button>
    </nav>

    <section id="studyPage" role="tabpanel" aria-labelledby="studyMainTab">
    <section class="control-card" id="studyControlCard" aria-label="학습 범위 설정">
      <button id="mobileControlToggle" class="mobile-control-toggle" type="button" aria-expanded="true" aria-controls="studyControlBody">
        <span class="mobile-control-toggle-copy">
          <strong>학습 설정</strong>
          <small id="mobileControlSummary"></small>
        </span>
        <span class="mobile-control-chevron" aria-hidden="true">⌃</span>
      </button>
      <div id="studyControlBody" class="control-card-body">
        <div class="control-grid">
          <label>과목<select id="subjectSelect"></select></label>
          <label>영역<select id="areaSelect"></select></label>
          <label>출제 항목<select id="familySelect"></select></label>
          <select id="stageSelect" hidden aria-hidden="true"></select>
        </div>
        <div class="mode-row">
          <div class="segmented" role="tablist" aria-label="학습 모드">
            <button data-mode="source" role="tab">원문</button>
            <button data-mode="typing" role="tab">따라치기</button>
            <button data-mode="mask" role="tab">마스킹</button>
            <button data-mode="cloze" role="tab" class="active">빈칸 채우기</button>
          </div>
          <div class="mode-tools">
            <label class="retry-pill" title="ON: 오답·모름·표기 확인을 3개 뒤 카드로 다시 묻습니다. OFF로 바꾸면 현재 대기 중인 오답 카드도 삭제됩니다.">
              <input type="checkbox" id="retryToggle" checked>
              <span class="retry-pill-label">오답 카드</span>
              <strong id="retryToggleState">ON</strong>
              <small>3개 뒤</small>
            </label>
            <button class="source-button" id="sourceButton">원문 출처</button>
          </div>
        </div>
      </div>
    </section>

    <section class="study-card" id="studyCard">
      <div class="study-meta"><span id="taskMeta" class="task-meta-hidden" aria-hidden="true"></span><span id="progressMeta"></span></div>
      <div id="studyContent"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="study-actions">
        <button id="checkButton" class="primary">채점</button>
        <button id="revealButton">정답 보기</button>
      </div>
      <div class="study-footer-controls" aria-label="학습 이동 및 초기화">
        <div class="task-nav-group">
          <button id="prevButton">이전</button>
          <button id="nextButton">다음</button>
        </div>
        <div class="secondary-actions footer-secondary-actions">
          <div class="secondary-button-group"><button id="clearAnswersButton" class="text-button" title="저장된 빈칸 입력과 판정만 비웁니다. 복습 기록은 유지됩니다.">빈칸 비우기</button><button id="nextRoundButton" class="text-button">처음부터</button></div>
        </div>
        <nav id="areaNavigator" class="area-navigator area-navigator-bottom" hidden aria-label="영역 이동">
          <button id="prevAreaButton" type="button" aria-label="이전 영역">← 이전 영역</button>
          <strong id="currentAreaLabel"></strong>
          <button id="nextAreaButton" type="button" aria-label="다음 영역">다음 영역 →</button>
        </nav>
      </div>
    </section>

    <footer class="provenance-footer" id="provenanceFooter" aria-label="현재 학습 출처"></footer>
    </section>

    <section id="reviewPage" class="review-page hidden" role="tabpanel" aria-labelledby="reviewMainTab">
      <section class="review-card">
        <div class="review-head">
          <div><span class="review-kicker">복습</span><h2>다시 꺼내기</h2></div>
          <div class="review-head-actions"><div id="reviewSummary" class="review-summary"></div><button id="resetReviewButton" class="danger-ghost" type="button">복습 데이터 초기화</button></div>
        </div>
        <div class="review-stats">
          <div class="review-stat"><span>오늘의 복습</span><strong id="reviewTodayCount">0</strong><small>1·3·7·14·21·30일 간격</small></div>
          <div class="review-stat"><span>지연 재인출</span><strong id="reviewRetryCount">0</strong><small>오답·모름·표기 확인</small></div>
          <div class="review-stat"><span>취약 항목</span><strong id="reviewWeakCount">0</strong><small>누적 실패 기록이 있는 원문</small></div>
        </div>
        <section class="review-section">
          <div class="review-section-head"><h3>오늘의 복습</h3><small>예정된 항목은 오늘 한 번 완료하면 다음 간격으로 넘어갑니다.</small></div>
          <div id="dailyReviewList" class="daily-review-list"></div>
        </section>
        <section class="review-section">
          <div class="review-section-head"><h3>지연 재인출</h3><small>카드를 눌러 원래 문맥에서 다시 답합니다.</small></div>
          <div id="reviewRetryList" class="review-list"></div>
        </section>
        <section class="review-section">
          <div class="review-section-head"><h3>취약 항목</h3><small>누적 기록 기준 상위 항목</small></div>
          <div id="reviewWeakList" class="review-list"></div>
        </section>
      </section>
    </section>

    <section id="examPage" class="exam-page hidden" role="tabpanel" aria-labelledby="examMainTab">
      <section class="exam-card">
        <div class="exam-head">
          <div>
            <span class="review-kicker">기출문제</span>
            <h2>정보·컴퓨터 전공 기출</h2>
            <p id="examCoverage" class="exam-coverage"></p>
          </div>
          <div id="examSummary" class="exam-summary"></div>
        </div>
        <div class="exam-filters" aria-label="기출문제 필터">
          <label>연도<select id="examYearSelect"></select></label>
          <label>시험<select id="examPartSelect"><option value="all">전공 A·B 전체</option><option value="A">전공 A</option><option value="B">전공 B</option></select></label>
          <label>과목<select id="examSubjectSelect"></select></label>
          <label>주제<select id="examTopicSelect"></select></label>
          <label>풀이<select id="examSolutionSelect"><option value="all">전체</option><option value="solved">풀이 있음</option><option value="pending">풀이 준비중</option></select></label>
          <label class="exam-search-label">검색<input id="examSearchInput" type="search" placeholder="문제·태그 검색" autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="exam-layout">
          <aside class="exam-results-pane" aria-label="기출문제 목록">
            <div class="exam-results-head"><strong id="examResultCount">0문항</strong><button id="examResetFilters" class="text-button" type="button">필터 초기화</button></div>
            <div id="examQuestionList" class="exam-question-list"></div>
          </aside>
          <article id="examDetail" class="exam-detail" aria-live="polite"></article>
        </div>
      </section>
    </section>
  </main>


  <aside id="areaMemoDock" class="area-memo-dock" aria-label="영역별 메모장">
    <section id="areaMemoShell" class="area-memo-shell">
      <button id="areaMemoTab" class="area-memo-tab" type="button" aria-expanded="false" aria-controls="areaMemoPanel">
        <span class="area-memo-tab-icon" aria-hidden="true">✎</span>
        <span class="area-memo-tab-short">메모</span>
      </button>
      <div id="areaMemoPanel" class="area-memo-panel">
        <div class="area-memo-head">
          <div>
            <strong id="areaMemoTitle">영역 메모</strong>
            <small id="areaMemoScope">현재 영역</small>
          </div>
          <button id="areaMemoClose" class="area-memo-icon-button" type="button" aria-label="메모장 접기">×</button>
        </div>
        <textarea id="areaMemoText" class="area-memo-text" spellcheck="false" placeholder="이 영역에서 헷갈리는 점, 외울 것, 문제 풀이 메모를 적어두세요."></textarea>
        <div class="area-memo-foot">
          <span id="areaMemoSaveStatus" class="area-memo-save-status">자동 저장</span>
          <button id="areaMemoClear" class="area-memo-clear" type="button" title="현재 영역의 기본 개요로 되돌립니다.">개요로 초기화</button>
        </div>
      </div>
    </section>
  </aside>

  <aside id="retryDock" class="retry-dock" aria-label="지연 재인출 카드" aria-live="polite"></aside>

  <nav class="page-jump-dock" aria-label="페이지 빠른 이동"><button id="scrollTopButton" type="button" title="맨 위로">↑ 맨 위</button><button id="scrollBottomButton" type="button" title="맨 아래로">맨 아래 ↓</button></nav>

  <dialog id="sourceDialog">
    <div class="dialog-head"><strong>원문 출처</strong><button id="closeSource" aria-label="닫기">×</button></div>
    <div id="sourceDialogBody"></div>
  </dialog>

  <script src="data/generated/study-data.js?b=20261019-14"></script>
  <script src="data/generated/exam-data.js?b=20261019-14"></script>
  <script src="data/generated/ai-basic-data.js?b=20261019-14"></script>
  <script src="data/generated/exam-display-bounds.js?b=20261019-14"></script>
  <script src="js/core/config.js?b=20261019-14"></script>
  <script src="js/core/storage.js?b=20261019-14"></script>
  <script src="js/core/grading.js?b=20261019-14"></script>
  <script src="js/core/study-engine.js?b=20261019-14"></script>
  <script src="js/app.js?b=20261019-14"></script>
</body>
</html>
