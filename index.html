<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CoreLoop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      background: #f6f7f9;
      color: #202124;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 0;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 24px;
    }

    .tabs {
      display: flex;
      gap: 28px;
    }

    .tab {
      padding: 12px 4px;
      border: none;
      background: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      color: #777;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: #111;
      border-bottom-color: #111;
    }

    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .description {
      color: #666;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
    }

    .start-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-button {
      margin-top: 12px;
      background: white;
      color: #111;
      border: 1px solid #d1d5db;
    }

    .hidden {
      display: none;
    }

    /* 문제 화면 */

    .quiz-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .chip {
      padding: 7px 11px;
      border-radius: 20px;
      background: #f1f3f5;
      font-size: 14px;
      color: #555;
    }

    .question-box {
      background: #f8f9fa;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
      line-height: 1.7;
      font-size: 18px;
    }

    .answer-input {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
    }

    .result-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      background: #f6f7f9;
      line-height: 1.6;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .button-row button {
      flex: 1;
    }

    @media (max-width: 600px) {

      .header-inner {
        padding-top: 18px;
      }

      main {
        margin-top: 20px;
      }

      .panel {
        padding: 20px;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="header-inner">

    <h1>CoreLoop</h1>

    <nav class="tabs">

      <button
        class="tab active"
        id="generalTab"
        onclick="showTab('general')"
      >
        총론
      </button>

      <button
        class="tab"
        id="subjectTab"
        onclick="showTab('subject')"
      >
        각론
      </button>

    </nav>

  </div>

</header>


<main>

  <!-- ========================= -->
  <!-- 총론 설정 -->
  <!-- ========================= -->

  <section id="generalPage">

    <div class="panel">

      <h2>총론 학습</h2>

      <p class="description">
        국가 교육과정 총론과 정보과 교육과정의 주요 변천 내용을 학습합니다.
        선택한 범위의 문제를 순서대로 모두 풉니다.
      </p>

      <div class="field">

        <label for="generalCategory">
          학습 범위
        </label>

        <select id="generalCategory">

          <option value="all">
            전체
          </option>

          <option value="competency">
            추구하는 인간상 · 핵심역량
          </option>

          <option value="history">
            정보과 교육과정 변천
          </option>

          <option value="hours">
            시수 · 편제
          </option>

          <option value="subjects">
            교과 · 선택과목 변화
          </option>

          <option value="comparison">
            2015 · 2022 개정 비교
          </option>

        </select>

      </div>

      <button
        class="start-button"
        onclick="startGeneralQuiz()"
      >
        총론 문제 시작
      </button>

    </div>

  </section>


  <!-- ========================= -->
  <!-- 각론 설정 -->
  <!-- ========================= -->

  <section
    id="subjectPage"
    class="hidden"
  >

    <div class="panel">

      <h2>각론 학습</h2>

      <p class="description">
        과목, 영역, 출제 항목과 난이도를 선택하여 문제를 풉니다.
      </p>


      <!-- 과목 -->

      <div class="field">

        <label for="subjectSelect">
          과목
        </label>

        <select
          id="subjectSelect"
          onchange="updateUnits()"
        >

          <option value="all">
            전체
          </option>

          <option value="middle-info">
            중학교 정보
          </option>

          <option value="high-info">
            고등학교 정보
          </option>

          <option value="ai-basic">
            인공지능 기초
          </option>

          <option value="data-science">
            데이터 과학
          </option>

          <option value="software-life">
            소프트웨어와 생활
          </option>

          <option value="info-science">
            정보과학
          </option>

        </select>

      </div>


      <!-- 영역 -->

      <div class="field">

        <label for="unitSelect">
          영역
        </label>

        <select id="unitSelect">

          <option value="all">
            전체
          </option>

        </select>

      </div>


      <!-- 출제 항목 -->

      <div class="field">

        <label for="contentSelect">
          출제 항목
        </label>

        <select id="contentSelect">

          <option value="all">
            전체
          </option>

          <option value="content-system">
            내용 체계
          </option>

          <option value="achievement">
            성취기준
          </option>

        </select>

      </div>


      <!-- 난이도 -->

      <div class="field">

        <label for="difficultySelect">
          난이도
        </label>

        <select id="difficultySelect">

          <option value="all">
            전체
          </option>

          <option value="easy">
            초급
          </option>

          <option value="normal">
            중급
          </option>

          <option value="hard">
            고급
          </option>

          <option value="recall">
            암송
          </option>

        </select>

      </div>


      <button
        class="start-button"
        onclick="startSubjectQuiz(false)"
      >
        선택 범위 시작
      </button>

      <button
        class="start-button secondary-button"
        onclick="startSubjectQuiz(true)"
      >
        완전 랜덤
      </button>

    </div>

  </section>


  <!-- ========================= -->
  <!-- 문제 화면 -->
  <!-- ========================= -->

  <section
    id="quizPage"
    class="hidden"
  >

    <div class="panel">

      <h2 id="quizTitle">
        문제
      </h2>

      <div
        class="quiz-meta"
        id="quizMeta"
      >
      </div>


      <div
        class="question-box"
        id="questionText"
      >
        문제
      </div>


      <div class="field">

        <label for="answerInput">
          답안
        </label>

        <textarea
          id="answerInput"
          class="answer-input"
          placeholder="정답을 입력하세요."
        ></textarea>

      </div>


      <button
        class="start-button"
        onclick="checkAnswerPlaceholder()"
      >
        정답 확인
      </button>


      <div
        id="resultBox"
        class="result-box hidden"
      >
      </div>


      <div class="button-row">

        <button
          class="start-button secondary-button"
          onclick="backToSettings()"
        >
          설정으로 돌아가기
        </button>

        <button
          class="start-button secondary-button"
          onclick="nextPlaceholderQuestion()"
        >
          다음 문제
        </button>

      </div>

    </div>

  </section>

</main>


<script>

  /* ========================================
     과목별 영역
  ======================================== */

  const subjectAreas = {

    "all": [
      "전체"
    ],


    "middle-info": [
      "전체",
      "컴퓨팅 시스템",
      "데이터",
      "알고리즘과 프로그래밍",
      "인공지능",
      "디지털 문화"
    ],


    "high-info": [
      "전체",
      "컴퓨팅 시스템",
      "데이터",
      "알고리즘과 프로그래밍",
      "인공지능",
      "디지털 문화"
    ],


    "ai-basic": [
      "전체",
      "인공지능의 이해",
      "인공지능과 학습",
      "인공지능의 사회적 영향",
      "인공지능 프로젝트"
    ],


    "data-science": [
      "전체",
      "데이터 과학의 이해",
      "데이터 준비와 분석",
      "데이터 모델링과 평가",
      "데이터 과학 프로젝트"
    ],


    "software-life": [
      "전체",
      "세상을 변화시키는 소프트웨어",
      "창작을 지원하는 소프트웨어",
      "현상을 분석하는 소프트웨어",
      "모의 실험하는 소프트웨어",
      "가치를 창출하는 소프트웨어"
    ],


    /*
      2022 개정 정보과학
      [12정과01] 프로그래밍
      [12정과02] 데이터 구조
      [12정과03] 알고리즘
      [12정과04] 정보과학 프로젝트
    */

    "info-science": [
      "전체",
      "프로그래밍",
      "데이터 구조",
      "알고리즘",
      "정보과학 프로젝트"
    ]

  };


  /* ========================================
     현재 문제의 출처
  ======================================== */

  let currentQuizType = "subject";


  /* ========================================
     영역 자동 변경
  ======================================== */

  function updateUnits() {

    const subjectSelect =
      document.getElementById("subjectSelect");

    const unitSelect =
      document.getElementById("unitSelect");

    const selectedSubject =
      subjectSelect.value;


    unitSelect.innerHTML = "";


    const areas =
      subjectAreas[selectedSubject] || ["전체"];


    areas.forEach(function(area) {

      const option =
        document.createElement("option");

      option.value = area;
      option.textContent = area;

      unitSelect.appendChild(option);

    });

  }


  /* ========================================
     총론 / 각론 탭
  ======================================== */

  function showTab(tab) {

    const generalPage =
      document.getElementById("generalPage");

    const subjectPage =
      document.getElementById("subjectPage");

    const quizPage =
      document.getElementById("quizPage");

    const generalTab =
      document.getElementById("generalTab");

    const subjectTab =
      document.getElementById("subjectTab");


    quizPage.classList.add("hidden");


    if (tab === "general") {

      generalPage.classList.remove("hidden");
      subjectPage.classList.add("hidden");

      generalTab.classList.add("active");
      subjectTab.classList.remove("active");

    }

    else {

      generalPage.classList.add("hidden");
      subjectPage.classList.remove("hidden");

      generalTab.classList.remove("active");
      subjectTab.classList.add("active");

    }

  }


  /* ========================================
     선택된 글자 얻기
  ======================================== */

  function getSelectedText(id) {

    const select =
      document.getElementById(id);

    return select.options[
      select.selectedIndex
    ].text;

  }


  /* ========================================
     랜덤 선택
  ======================================== */

  function randomItem(array) {

    return array[
      Math.floor(
        Math.random() * array.length
      )
    ];

  }


  /* ========================================
     총론 문제 시작
  ======================================== */

  function startGeneralQuiz() {

    currentQuizType = "general";

    const category =
      getSelectedText("generalCategory");


    showQuizPage(
      "총론 문제",
      [
        category
      ]
    );

  }


  /* ========================================
     각론 문제 시작
  ======================================== */

  function startSubjectQuiz(randomMode) {

    currentQuizType = "subject";


    const subjectSelect =
      document.getElementById("subjectSelect");

    const unitSelect =
      document.getElementById("unitSelect");

    const contentSelect =
      document.getElementById("contentSelect");

    const difficultySelect =
      document.getElementById("difficultySelect");


    /*
      완전 랜덤
    */

    if (randomMode) {

      const subjects = [
        "middle-info",
        "high-info",
        "ai-basic",
        "data-science",
        "software-life",
        "info-science"
      ];


      subjectSelect.value =
        randomItem(subjects);


      updateUnits();


      const areaOptions =
        Array.from(unitSelect.options)
          .filter(
            option =>
              option.value !== "전체"
          );


      if (areaOptions.length > 0) {

        unitSelect.value =
          randomItem(areaOptions).value;

      }


      contentSelect.value =
        randomItem([
          "content-system",
          "achievement"
        ]);


      difficultySelect.value =
        randomItem([
          "easy",
          "normal",
          "hard",
          "recall"
        ]);

    }


    const subject =
      getSelectedText("subjectSelect");

    const unit =
      getSelectedText("unitSelect");

    const content =
      getSelectedText("contentSelect");

    const difficulty =
      getSelectedText("difficultySelect");


    showQuizPage(
      "각론 문제",
      [
        subject,
        unit,
        content,
        difficulty
      ]
    );

  }


  /* ========================================
     문제 화면 표시
  ======================================== */

  function showQuizPage(
    title,
    metaItems
  ) {

    const generalPage =
      document.getElementById("generalPage");

    const subjectPage =
      document.getElementById("subjectPage");

    const quizPage =
      document.getElementById("quizPage");


    generalPage.classList.add("hidden");
    subjectPage.classList.add("hidden");

    quizPage.classList.remove("hidden");


    document.getElementById(
      "quizTitle"
    ).textContent = title;


    const quizMeta =
      document.getElementById("quizMeta");


    quizMeta.innerHTML = "";


    metaItems.forEach(function(item) {

      const chip =
        document.createElement("span");

      chip.className = "chip";

      chip.textContent = item;

      quizMeta.appendChild(chip);

    });


    /*
      다음 단계에서 실제 문제 데이터와 연결
    */

    document.getElementById(
      "questionText"
    ).textContent =
      "문제 데이터가 여기에 표시됩니다. 다음 단계에서 공식 교육과정과 기출 기반 변형문제를 연결합니다.";


    document.getElementById(
      "answerInput"
    ).value = "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");

  }


  /* ========================================
     정답 확인 - 현재는 테스트용
  ======================================== */

  function checkAnswerPlaceholder() {

    const resultBox =
      document.getElementById("resultBox");


    resultBox.classList.remove("hidden");


    resultBox.innerHTML =
      "<strong>채점 기능 준비 완료</strong><br>" +
      "다음 단계에서 실제 정답 데이터와 연결합니다.";

  }


  /* ========================================
     다음 문제 - 현재는 테스트용
  ======================================== */

  function nextPlaceholderQuestion() {

    document.getElementById(
      "answerInput"
    ).value = "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");

  }


  /* ========================================
     설정 화면 복귀
  ======================================== */

  function backToSettings() {

    const quizPage =
      document.getElementById("quizPage");

    const generalPage =
      document.getElementById("generalPage");

    const subjectPage =
      document.getElementById("subjectPage");


    quizPage.classList.add("hidden");


    if (currentQuizType === "general") {

      generalPage.classList.remove("hidden");

    }

    else {

      subjectPage.classList.remove("hidden");

    }

  }


  /* ========================================
     최초 실행
  ======================================== */

  updateUnits();

</script>

</body>

</html>
