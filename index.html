<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreLoop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #f6f7f9;
      color: #202124;
    }
    header { background: white; border-bottom: 1px solid #e5e7eb; }
    .header-inner { max-width: 900px; margin: 0 auto; padding: 24px 20px 0; }
    h1 { margin: 0 0 22px; font-size: 24px; }
    .tabs { display: flex; gap: 28px; }
    .tab {
      padding: 12px 4px;
      border: none;
      background: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      color: #777;
      border-bottom: 3px solid transparent;
    }
    .tab.active { color: #111; border-bottom-color: #111; }
    main { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
    }
    .panel h2 { margin-top: 0; font-size: 22px; }
    .description { color: #666; margin-bottom: 28px; line-height: 1.6; }
    .field { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
    }
    .start-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .secondary-button {
      margin-top: 12px;
      background: white;
      color: #111;
      border: 1px solid #d1d5db;
    }
    .hidden { display: none !important; }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      color: #666;
      font-size: 14px;
    }
    .quiz-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .chip {
      padding: 7px 11px;
      border-radius: 20px;
      background: #f1f3f5;
      font-size: 14px;
      color: #555;
    }
    .question-box {
      background: #f8f9fa;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 26px;
      margin-bottom: 22px;
      line-height: 1.75;
      font-size: 18px;
      white-space: pre-wrap;
    }
    .answer-input {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
    }
    .result-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 10px;
      line-height: 1.7;
      border: 1px solid #e5e7eb;
    }
    .result-box.correct { background: #f0fdf4; border-color: #bbf7d0; }
    .result-box.wrong { background: #fff7ed; border-color: #fed7aa; }
    .answer-label { margin-top: 8px; font-weight: 700; }
    .button-row { display: flex; gap: 12px; margin-top: 18px; }
    .button-row button { flex: 1; }
    .empty-message { text-align: center; padding: 35px 10px; color: #666; line-height: 1.7; }
    .summary-number { font-size: 34px; font-weight: 800; margin: 14px 0; }

    @media (max-width: 600px) {
      .header-inner { padding-top: 18px; }
      main { margin-top: 20px; }
      .panel { padding: 20px; }
      .button-row { flex-direction: column; }
      .quiz-top { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>CoreLoop</h1>
    <nav class="tabs">
      <button class="tab active" id="generalTab" onclick="showTab('general')">총론</button>
      <button class="tab" id="subjectTab" onclick="showTab('subject')">각론</button>
    </nav>
  </div>
</header>

<main>
  <section id="generalPage">
    <div class="panel">
      <h2>총론 학습</h2>
      <p class="description">선택한 범위에 등록된 총론 문제를 한 세트로 모두 풉니다.</p>
      <div class="field">
        <label for="generalCategory">학습 범위</label>
        <select id="generalCategory">
          <option value="all">전체</option>
          <option value="competency">추구하는 인간상 · 핵심역량</option>
          <option value="history">정보과 교육과정 변천</option>
          <option value="hours">시수 · 편제</option>
          <option value="subjects">교과 · 선택과목 변화</option>
          <option value="comparison">2015 · 2022 개정 비교</option>
        </select>
      </div>
      <button class="start-button" onclick="startGeneralQuiz()">총론 문제 시작</button>
    </div>
  </section>

  <section id="subjectPage" class="hidden">
    <div class="panel">
      <h2>각론 학습</h2>
      <p class="description">과목, 영역, 출제 항목과 난이도를 선택하여 등록된 문제를 풉니다.</p>

      <div class="field">
        <label for="subjectSelect">과목</label>
        <select id="subjectSelect" onchange="updateUnits()">
          <option value="all">전체</option>
          <option value="middle-info">중학교 정보</option>
          <option value="high-info">고등학교 정보</option>
          <option value="ai-basic">인공지능 기초</option>
          <option value="data-science">데이터 과학</option>
          <option value="software-life">소프트웨어와 생활</option>
          <option value="info-science">정보과학</option>
        </select>
      </div>

      <div class="field">
        <label for="unitSelect">영역</label>
        <select id="unitSelect"><option value="all">전체</option></select>
      </div>

      <div class="field">
        <label for="contentSelect">출제 항목</label>
        <select id="contentSelect">
          <option value="all">전체</option>
          <option value="content-system">내용 체계</option>
          <option value="achievement">성취기준</option>
        </select>
      </div>

      <div class="field">
        <label for="difficultySelect">난이도</label>
        <select id="difficultySelect">
          <option value="all">전체</option>
          <option value="easy">초급</option>
          <option value="normal">중급</option>
          <option value="hard">고급</option>
          <option value="recall">암송</option>
        </select>
      </div>

      <button class="start-button" onclick="startSubjectQuiz(false)">선택 범위 시작</button>
      <button class="start-button secondary-button" onclick="startSubjectQuiz(true)">완전 랜덤</button>
    </div>
  </section>

  <section id="quizPage" class="hidden">
    <div class="panel">
      <div class="quiz-top">
        <span id="progressText">1 / 1</span>
        <span id="scoreText">정답 0 · 오답 0</span>
      </div>

      <h2 id="quizTitle">문제</h2>
      <div class="quiz-meta" id="quizMeta"></div>
      <div class="question-box" id="questionText"></div>

      <div id="answerArea">
        <div class="field">
          <label for="answerInput">답안</label>
          <textarea id="answerInput" class="answer-input" placeholder="정답을 입력하세요."></textarea>
        </div>

        <button id="checkButton" class="start-button" onclick="checkAnswer()">정답 확인</button>
        <div id="resultBox" class="result-box hidden"></div>

        <div class="button-row">
          <button class="start-button secondary-button" onclick="backToSettings()">설정으로 돌아가기</button>
          <button id="nextButton" class="start-button secondary-button" onclick="nextQuestion()">다음 문제</button>
        </div>
      </div>

      <div id="summaryArea" class="hidden empty-message">
        <div>학습 완료</div>
        <div id="summaryScore" class="summary-number"></div>
        <div id="summaryDetail"></div>
        <button class="start-button" style="margin-top:24px" onclick="backToSettings()">설정으로 돌아가기</button>
      </div>
    </div>
  </section>
</main>

  let currentQuizType = "general";
  let activeSession = [];
  let currentIndex = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let checkedCurrent = false;

  function updateUnits() {
    const subject = document.getElementById("subjectSelect").value;
    const unitSelect = document.getElementById("unitSelect");
    unitSelect.innerHTML = "";
    (subjectAreas[subject] || ["전체"]).forEach(area => {
      const option = document.createElement("option");
      option.value = area === "전체" ? "all" : area;
      option.textContent = area;
      unitSelect.appendChild(option);
    });
  }

  function showTab(tab) {
    document.getElementById("quizPage").classList.add("hidden");
    const isGeneral = tab === "general";
    document.getElementById("generalPage").classList.toggle("hidden", !isGeneral);
    document.getElementById("subjectPage").classList.toggle("hidden", isGeneral);
    document.getElementById("generalTab").classList.toggle("active", isGeneral);
    document.getElementById("subjectTab").classList.toggle("active", !isGeneral);
  }

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function randomLevel() {
    const levels = ["easy", "normal", "hard", "recall"];
    return levels[Math.floor(Math.random() * levels.length)];
  }

  function startGeneralQuiz() {
    const category = document.getElementById("generalCategory").value;
    let questions = questionBank.filter(q => q.section === "general");
    if (category !== "all") questions = questions.filter(q => q.category === category);
    activeSession = shuffle(questions).map(q => ({ q, level: "normal" }));
    currentQuizType = "general";
    beginSession();
  }

  function startSubjectQuiz(randomMode) {
    let questions = questionBank.filter(q => q.section === "subject");
    let chosenDifficulty = document.getElementById("difficultySelect").value;

    if (!randomMode) {
      const subject = document.getElementById("subjectSelect").value;
      const area = document.getElementById("unitSelect").value;
      const group = document.getElementById("contentSelect").value;

      if (subject !== "all") questions = questions.filter(q => q.subject === subject);
      if (area !== "all") questions = questions.filter(q => q.area === area);
      if (group !== "all") questions = questions.filter(q => q.group === group);
    } else {
      chosenDifficulty = "all";
    }

    activeSession = shuffle(questions).map(q => ({
      q,
      level: chosenDifficulty === "all" ? randomLevel() : chosenDifficulty
    }));

    currentQuizType = "subject";
    beginSession();
  }

  function beginSession() {
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    checkedCurrent = false;

    if (activeSession.length === 0) {
      alert("현재 선택 범위에 등록된 문제가 없습니다. 문제은행을 계속 추가할 예정입니다.");
      return;
    }

    document.getElementById("generalPage").classList.add("hidden");
    document.getElementById("subjectPage").classList.add("hidden");
    document.getElementById("quizPage").classList.remove("hidden");
    document.getElementById("summaryArea").classList.add("hidden");
    document.getElementById("answerArea").classList.remove("hidden");
    document.getElementById("questionText").classList.remove("hidden");
    document.getElementById("quizMeta").classList.remove("hidden");
    renderQuestion();
  }

  function renderQuestion() {
    const item = activeSession[currentIndex];
    const q = item.q;
    const level = item.level;
    const prompt = q.prompts[level] || q.prompts.normal || Object.values(q.prompts)[0];

    checkedCurrent = false;
    document.getElementById("answerInput").value = "";
    document.getElementById("resultBox").className = "result-box hidden";
    document.getElementById("resultBox").innerHTML = "";
    document.getElementById("checkButton").disabled = false;

    document.getElementById("quizTitle").textContent = q.section === "general" ? "총론 문제" : "각론 문제";
    document.getElementById("questionText").textContent = prompt;
    document.getElementById("progressText").textContent = `${currentIndex + 1} / ${activeSession.length}`;
    document.getElementById("scoreText").textContent = `정답 ${correctCount} · 오답 ${wrongCount}`;
    document.getElementById("nextButton").textContent = currentIndex === activeSession.length - 1 ? "결과 보기" : "다음 문제";

    const meta = document.getElementById("quizMeta");
    meta.innerHTML = "";
    const items = q.section === "general"
      ? [q.subtype, q.source]
      : [subjectName(q.subject), q.area, q.group === "content-system" ? "내용 체계" : "성취기준", q.subtype, difficultyName(level), q.source];

    items.forEach(text => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = text;
      meta.appendChild(chip);
    });
  }

  function normalizeText(text) {
    return String(text || "")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]/gu, "");
  }

  function isCorrectAnswer(q, userAnswer) {
    const normalizedUser = normalizeText(userAnswer);
    if (!normalizedUser) return false;

    if (q.answerMode === "exactAny") {
      return (q.accepted || []).some(answer => normalizeText(answer) === normalizedUser);
    }

    if (q.answerMode === "containsAll") {
      return (q.required || []).every(term => normalizedUser.includes(normalizeText(term)));
    }

    return false;
  }

  function checkAnswer() {
    if (checkedCurrent) return;

    const item = activeSession[currentIndex];
    const q = item.q;
    const userAnswer = document.getElementById("answerInput").value;
    const correct = isCorrectAnswer(q, userAnswer);
    const resultBox = document.getElementById("resultBox");

    checkedCurrent = true;
    if (correct) correctCount += 1;
    else wrongCount += 1;

    resultBox.classList.remove("hidden");
    resultBox.classList.add(correct ? "correct" : "wrong");
    resultBox.innerHTML = `
      <strong>${correct ? "✅ 정답" : "❌ 오답"}</strong>
      <div class="answer-label">정답</div>
      <div>${escapeHtml(q.displayAnswer)}</div>
      <div class="answer-label">설명</div>
      <div>${escapeHtml(q.explanation)}</div>
    `;

    document.getElementById("scoreText").textContent = `정답 ${correctCount} · 오답 ${wrongCount}`;
    document.getElementById("checkButton").disabled = true;
  }

  function nextQuestion() {
    if (!checkedCurrent) {
      alert("먼저 정답 확인을 눌러 주세요.");
      return;
    }

    if (currentIndex >= activeSession.length - 1) {
      finishSession();
      return;
    }

    currentIndex += 1;
    renderQuestion();
  }

  function finishSession() {
    document.getElementById("answerArea").classList.add("hidden");
    document.getElementById("summaryArea").classList.remove("hidden");
    document.getElementById("questionText").classList.add("hidden");
    document.getElementById("quizMeta").classList.add("hidden");

    const total = correctCount + wrongCount;
    const rate = total ? Math.round((correctCount / total) * 1000) / 10 : 0;
    document.getElementById("summaryScore").textContent = `${rate}%`;
    document.getElementById("summaryDetail").textContent = `${total}문제 중 ${correctCount}문제 정답 · ${wrongCount}문제 오답`;
  }

  function backToSettings() {
    document.getElementById("quizPage").classList.add("hidden");
    document.getElementById("answerArea").classList.remove("hidden");
    document.getElementById("summaryArea").classList.add("hidden");
    document.getElementById("questionText").classList.remove("hidden");
    document.getElementById("quizMeta").classList.remove("hidden");

    if (currentQuizType === "general") showTab("general");
    else showTab("subject");
  }

  function subjectName(value) {
    const names = {
      "middle-info": "중학교 정보",
      "high-info": "고등학교 정보",
      "ai-basic": "인공지능 기초",
      "data-science": "데이터 과학",
      "software-life": "소프트웨어와 생활",
      "info-science": "정보과학"
    };
    return names[value] || value;
  }

  function difficultyName(value) {
    const names = { easy: "초급", normal: "중급", hard: "고급", recall: "암송" };
    return names[value] || value;
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  updateUnits();
</script>
