<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreLoop</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --line: #dfe3e8;
      --muted: #6b7280;
      --text: #17191c;
      --soft: #f7f8fa;
      --good: #11823b;
      --bad: #d33a3a;
      --blue: #2563eb;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 24px 0;
    }
    h1 { margin: 0 0 18px; font-size: 25px; }
    .tabs { display: flex; gap: 28px; }
    .tab {
      border: 0;
      background: transparent;
      padding: 12px 4px 13px;
      font-weight: 700;
      font-size: 17px;
      color: #777;
      border-bottom: 3px solid transparent;
    }
    .tab.active { color: #111; border-bottom-color: #111; }
    main { max-width: 1180px; margin: 22px auto 60px; padding: 0 20px; }
    .hidden { display: none !important; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
    }
    .control-panel {
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,.055);
      margin-bottom: 18px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    .field label { display:block; margin-bottom:7px; font-size:14px; font-weight:700; }
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccd2d9;
      border-radius: 9px;
      background: #fff;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
      align-items: center;
    }
    .btn {
      border: 1px solid #d3d8df;
      background: #fff;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: 700;
      color: #222;
    }
    .btn.primary { background:#111; border-color:#111; color:#fff; }
    .btn.soft { background: #f7f8fa; }
    .btn:disabled { opacity:.38; cursor:not-allowed; }
    .score { margin-left:auto; font-weight:800; white-space:nowrap; }
    .unit-nav {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .unit-title { text-align:center; font-weight:800; }
    .unit-progress { display:block; color:var(--muted); font-weight:500; font-size:13px; margin-top:3px; }
    .study-shell {
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .study-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      background:#fbfcfd;
    }
    .study-head h2 { margin:0; font-size:20px; }
    .status-note { color:var(--muted); font-size:13px; }
    .section-table { width:100%; border-collapse:collapse; }
    .section-table th, .section-table td { border-bottom:1px solid var(--line); vertical-align:top; }
    .section-table th {
      width:150px;
      padding:18px 16px;
      text-align:center;
      background:#f1f3f5;
      font-size:16px;
      line-height:1.35;
    }
    .section-table td { padding:17px 20px; }
    .line-item {
      position:relative;
      margin: 0 0 11px;
      padding-left: 18px;
      line-height: 2.15;
      font-size:16px;
    }
    .line-item:last-child { margin-bottom:0; }
    .line-item::before { content:"•"; position:absolute; left:0; top:0; font-weight:800; }
    .gap-wrap { display:inline-flex; align-items:center; gap:5px; vertical-align:middle; margin:2px 2px; }
    .gap-input {
      min-width: 82px;
      max-width: 270px;
      height: 34px;
      padding: 5px 8px;
      border:1px solid #cfd5dc;
      border-radius:6px;
      background:#fafbfc;
      outline:none;
      color:#111;
    }
    .gap-input:focus { border-color:#4f86ef; box-shadow:0 0 0 2px rgba(79,134,239,.14); background:#fff; }
    .gap-input::placeholder { color:#adb3bb; opacity:1; }
    .gap-input.correct { border-color:#79b98c; background:#f4fbf6; }
    .gap-input.wrong { border-color:#e18b8b; background:#fff8f8; }
    .gap-result { font-size:14px; font-weight:800; white-space:nowrap; }
    .gap-result.good { color:var(--good); }
    .gap-result.bad { color:var(--bad); }
    .sentence-gap { width:min(100%, 820px); max-width:none; min-width:260px; }
    .original-panel {
      margin-top:16px;
      border:1px solid #cfd6df;
      border-radius:12px;
      background:#fff;
      overflow:hidden;
    }
    .original-head { padding:13px 16px; font-weight:800; background:#eef1f5; border-bottom:1px solid var(--line); }
    .original-body { padding:16px 20px; }
    .original-section { margin-bottom:18px; }
    .original-section:last-child { margin-bottom:0; }
    .original-section h3 { margin:0 0 8px; font-size:15px; }
    .original-section ul { margin:0; padding-left:22px; }
    .original-section li { margin:5px 0; line-height:1.6; }
    .empty {
      padding:60px 20px;
      text-align:center;
      color:#777;
      line-height:1.7;
    }
    .general-card .question { font-size:18px; line-height:1.7; background:var(--soft); padding:20px; border-radius:10px; margin:18px 0 14px; }
    .general-card textarea { width:100%; min-height:90px; padding:12px; border:1px solid #ccd2d9; border-radius:9px; resize:vertical; }
    .general-result { margin-top:12px; padding:13px 15px; border-radius:9px; background:#f7f8fa; line-height:1.6; }
    .general-result.good { border:1px solid #a9d4b5; }
    .general-result.bad { border:1px solid #efb0b0; }
    @media (max-width: 850px) {
      .controls { grid-template-columns:1fr 1fr; }
      .score { width:100%; margin-left:0; }
      .section-table th { width:115px; }
    }
    @media (max-width: 600px) {
      main { padding:0 10px; margin-top:12px; }
      .header-inner { padding:17px 14px 0; }
      .panel { padding:14px; }
      .controls { grid-template-columns:1fr; }
      .toolbar { gap:7px; }
      .btn { padding:9px 10px; }
      .section-table, .section-table tbody, .section-table tr, .section-table th, .section-table td { display:block; width:100%; }
      .section-table th { text-align:left; padding:10px 14px; }
      .section-table td { padding:13px 14px; }
      .unit-nav { padding:10px; }
      .unit-nav .btn { font-size:13px; }
      .gap-input { max-width:210px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>CoreLoop</h1>
    <nav class="tabs">
      <button class="tab active" id="generalTab" onclick="showTab('general')">총론</button>
      <button class="tab" id="subjectTab" onclick="showTab('subject')">각론</button>
    </nav>
  </div>
</header>

<main>
  <section id="generalPage">
    <div class="panel general-card">
      <div class="controls" style="grid-template-columns:1fr 1fr;">
        <div class="field">
          <label for="generalCategory">학습 범위</label>
          <select id="generalCategory" onchange="resetGeneral()">
            <option value="all">전체</option>
            <option value="competency">추구하는 인간상 · 핵심역량</option>
            <option value="history">정보과 교육과정 변천</option>
            <option value="hours">시수 · 편제</option>
            <option value="subjects">교과 · 선택과목 변화</option>
          </select>
        </div>
        <div class="field">
          <label>진행</label>
          <div id="generalProgress" style="padding:11px 0;font-weight:800;">1 / 1</div>
        </div>
      </div>
      <div class="question" id="generalQuestion"></div>
      <textarea id="generalAnswer" placeholder="답을 입력하세요. Enter: 채점 · Shift+Enter: 줄바꿈"></textarea>
      <div class="toolbar">
        <button class="btn primary" onclick="gradeGeneral()">정답 확인</button>
        <button class="btn" onclick="nextGeneral()">다음 문제</button>
      </div>
      <div id="generalResult" class="general-result hidden"></div>
    </div>
  </section>

  <section id="subjectPage" class="hidden">
    <div class="panel control-panel">
      <div class="controls">
        <div class="field">
          <label for="subjectSelect">과목</label>
          <select id="subjectSelect" onchange="onSubjectChange()">
            <option value="middle-info">중학교 정보</option>
            <option value="high-info">고등학교 정보</option>
            <option value="ai-basic">인공지능 기초</option>
            <option value="data-science">데이터 과학</option>
            <option value="software-life">소프트웨어와 생활</option>
            <option value="info-science">정보과학</option>
          </select>
        </div>
        <div class="field">
          <label for="areaSelect">영역</label>
          <select id="areaSelect" onchange="onAreaChange()"></select>
        </div>
        <div class="field">
          <label for="groupSelect">출제 항목</label>
          <select id="groupSelect" onchange="renderStudy()">
            <option value="content-system">내용 체계</option>
            <option value="achievement">성취기준</option>
            <option value="all">전체</option>
          </select>
        </div>
        <div class="field">
          <label for="difficultySelect">난이도</label>
          <select id="difficultySelect" onchange="onDifficultyChange()">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
            <option value="yaho">야~호!</option>
          </select>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn primary" onclick="startQuiz()">퀴즈 시작</button>
        <button class="btn" id="hintButton" onclick="toggleHints()">힌트 숨기기</button>
        <button class="btn" id="originalButton" onclick="toggleOriginal()">원문 보기</button>
        <button class="btn" onclick="gradeAllVisible()">전체 채점</button>
        <button class="btn soft" onclick="resetVisible()">현재 단원 초기화</button>
        <div class="score" id="scoreText">정답: 0 | 오답: 0</div>
      </div>
    </div>

    <div id="unitNav" class="unit-nav hidden">
      <button class="btn" id="prevUnit" onclick="moveUnit(-1)">← 이전 단원</button>
      <div class="unit-title" id="unitNavTitle"></div>
      <button class="btn" id="nextUnit" onclick="moveUnit(1)">다음 단원 →</button>
    </div>

    <div class="study-shell">
      <div class="study-head">
        <h2 id="studyTitle">학습 내용</h2>
        <div class="status-note" id="studyStatus">선택하면 원문 구조가 표시됩니다.</div>
      </div>
      <div id="studyArea"></div>
    </div>

    <div id="originalPanel" class="original-panel hidden">
      <div class="original-head">원문</div>
      <div class="original-body" id="originalBody"></div>
    </div>
  </section>
</main>

<script>
  // -------------------------

  const subjectAreas = {

    "high-info": ["컴퓨팅 시스템", "데이터", "알고리즘과 프로그래밍", "인공지능", "디지털 문화"],

    "software-life": ["세상을 변화시키는 소프트웨어", "창작을 지원하는 소프트웨어", "현상을 분석하는 소프트웨어", "모의 실험하는 소프트웨어", "가치를 창출하는 소프트웨어"],

  const subjectLabels = {

    "data-science":"데이터 과학", "software-life":"소프트웨어와 생활", "info-science":"정보과학"

  // -------------------------

  const S = (title, lines) => ({ title, lines });

          ]),
          S("지식·이해", [
            L("컴퓨팅 시스템의 동작 원리", ["동작 원리"], ["컴퓨팅 시스템", "동작 원리"]),

          ]),
          S("지식·이해", [

            L("데이터 구조화 및 해석", ["구조화", "해석"], ["데이터", "구조화", "해석"])
          ]),

  function getUnitData(subject, area, group) {

  function makeStateKey(sectionIndex, lineIndex, gapIndex) {

  // -------------------------
  // 6) 빈칸 생성
  // -------------------------
  const standaloneKeep = new Set([
    "그리고","그러나","하지만","또한","따라서","또는","및","등","때","통해","위해","위해서는","것은","것이","수","데","에","의","를","을","은","는","이","가","와","과","로","으로"
  ]);

  function deriveHardWords(text) {
    const raw = text.match(/[가-힣A-Za-z0-9*]+(?:·[가-힣A-Za-z0-9*]+)*/g) || [];
    const seen = new Set();
    const words = [];
    const particles = ["에서","에게","까지","부터","보다","처럼","만큼","으로","의","을","를","이","가","에","와","과","로","도","만","은","는"];

    raw.forEach(original => {
      if (standaloneKeep.has(original)) return;
      if (/\d/.test(original)) return; // 성취기준 코드·수치는 남긴다.

      let word = original;
      for (const particle of particles) {
        if (!word.endsWith(particle) || word.length <= particle.length + 1) continue;
        const stem = word.slice(0, -particle.length);

        // '해결하는/활용되는'처럼 관형형 어미인 은·는을 조사로 오인하지 않도록 보수적으로 처리한다.
        if ((particle === "은" || particle === "는") && /[하되있없않같되]$/.test(stem)) continue;

        word = stem;
        break;
      }

      if (standaloneKeep.has(word) || word.length <= 1) return;
      if (!seen.has(word)) { seen.add(word); words.push(word); }
    });
    return words;
  }

  function buildGapSpecs(line, difficulty) {
    if (difficulty === "yaho") return [{ answer: line.text, sentence: true, aliases: [] }];
    let phrases = difficulty === "easy" ? line.easy : difficulty === "normal" ? line.normal : deriveHardWords(line.text);
    phrases = [...new Set((phrases || []).filter(Boolean))].sort((a,b) => b.length - a.length);
    return phrases.map(p => ({ answer:p, sentence:false, aliases: line.aliases?.[p] || [] }));
  }

  function findOccurrences(text, specs) {
    const found = [];
    specs.forEach((spec, specIndex) => {
      let from = 0;
      while (from < text.length) {
        const idx = text.indexOf(spec.answer, from);
        if (idx < 0) break;
        found.push({start:idx, end:idx + spec.answer.length, specIndex, spec});
        from = idx + spec.answer.length;
      }
    });
    found.sort((a,b) => a.start - b.start || (b.end-b.start)-(a.end-a.start));
    const accepted = [];
    let lastEnd = -1;
    found.forEach(item => {
      if (item.start >= lastEnd) {
        accepted.push(item);
        lastEnd = item.end;
      }
    });
    return accepted;
  }

  function createGapInput(spec, sectionIndex, lineIndex, gapIndex) {
    const wrap = document.createElement("span");
    wrap.className = "gap-wrap";

    const input = document.createElement("input");
    input.type = "text";
    input.className = "gap-input" + (spec.sentence ? " sentence-gap" : "");
    input.dataset.answer = spec.answer;
    input.dataset.aliases = JSON.stringify(spec.aliases || []);
    input.dataset.stateKey = makeStateKey(sectionIndex, lineIndex, gapIndex);
    input.autocomplete = "off";
    input.spellcheck = false;
    if (!spec.sentence) {
      input.style.width = Math.max(82, Math.min(260, spec.answer.length * 17 + 28)) + "px";
    }
    if (hintsVisible) input.placeholder = spec.answer;

    const saved = fieldState[input.dataset.stateKey];
    if (saved) {
      input.value = saved.value || "";
      if (saved.status === "correct") input.classList.add("correct");
      if (saved.status === "wrong") input.classList.add("wrong");
    }

    input.addEventListener("input", () => {
      const state = fieldState[input.dataset.stateKey] || {};
      state.value = input.value;
      if (state.status) delete state.status;
      fieldState[input.dataset.stateKey] = state;
      input.classList.remove("correct","wrong");
      const result = wrap.querySelector(".gap-result");
      if (result) result.remove();
      updateScore();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        gradeOne(input);
        focusRelative(input, 1);
      } else if (event.key === "Tab") {
        event.preventDefault();
        focusRelative(input, event.shiftKey ? -1 : 1);
      }
    });

    wrap.appendChild(input);
    if (saved?.status) appendResult(wrap, saved.status, spec.answer);
    return wrap;
  }

  function renderLine(line, sectionIndex, lineIndex) {
    const p = document.createElement("div");
    p.className = "line-item";
    const difficulty = getCurrentDifficulty();
    const specs = buildGapSpecs(line, difficulty);

    if (difficulty === "yaho") {
      p.innerHTML = "";
      p.appendChild(createGapInput(specs[0], sectionIndex, lineIndex, 0));
      return p;
    }

    const occurrences = findOccurrences(line.text, specs);
    if (!occurrences.length) {
      p.textContent = line.text;
      return p;
    }

    let cursor = 0;
    let gapIndex = 0;
    occurrences.forEach(o => {
      if (o.start > cursor) p.appendChild(document.createTextNode(line.text.slice(cursor, o.start)));
      p.appendChild(createGapInput(o.spec, sectionIndex, lineIndex, gapIndex++));
      cursor = o.end;
    });
    if (cursor < line.text.length) p.appendChild(document.createTextNode(line.text.slice(cursor)));
    return p;
  }

  function renderOriginal() {

      div.appendChild(ul);
      body.appendChild(div);

  // -------------------------
  // 8) 채점
  // -------------------------
  function isCorrect(input) {
    const expected = input.dataset.answer;
    const aliases = JSON.parse(input.dataset.aliases || "[]");
    const user = normalize(input.value);
    if (!user) return false;
    return [expected, ...aliases].some(a => normalize(a) === user);
  }

  function appendResult(wrap, status, answer) {
    const old = wrap.querySelector(".gap-result");
    if (old) old.remove();
    const span = document.createElement("span");
    span.className = "gap-result " + (status === "correct" ? "good" : "bad");
    span.textContent = status === "correct" ? "✓" : `✕ ${answer}`;
    wrap.appendChild(span);
  }

  function gradeOne(input) {
    const correct = isCorrect(input);
    input.classList.remove("correct","wrong");
    input.classList.add(correct ? "correct" : "wrong");
    const state = fieldState[input.dataset.stateKey] || {};
    state.value = input.value;
    state.status = correct ? "correct" : "wrong";
    fieldState[input.dataset.stateKey] = state;
    appendResult(input.parentElement, state.status, input.dataset.answer);
    updateScore();
  }

  function gradeAllVisible() {
    document.querySelectorAll("#studyArea .gap-input").forEach(gradeOne);
  }

  function resetVisible() {
    const inputs = [...document.querySelectorAll("#studyArea .gap-input")];
    inputs.forEach(input => delete fieldState[input.dataset.stateKey]);
    renderStudy();
    focusFirstEmpty();
  }

  function focusRelative(current, delta) {
    const inputs = [...document.querySelectorAll("#studyArea .gap-input")];
    const i = inputs.indexOf(current);
    if (i < 0) return;
    const target = inputs[i + delta];
    if (target) target.focus();
  }

  function focusFirstEmpty() {
    const inputs = [...document.querySelectorAll("#studyArea .gap-input")];
    const target = inputs.find(i => !i.value) || inputs[0];
    if (target) target.focus();
  }

  function updateScore() {
    let correct = 0, wrong = 0;
    Object.values(fieldState).forEach(state => {
      if (state.status === "correct") correct++;
      if (state.status === "wrong") wrong++;
    });
    document.getElementById("scoreText").textContent = `정답: ${correct} | 오답: ${wrong}`;
  }

  // -------------------------
  // 9) 총론
  // -------------------------
  function filteredGeneral() {
    const category = document.getElementById("generalCategory").value;
    return category === "all" ? generalBank : generalBank.filter(q => q.category === category);
  }

  function resetGeneral() { generalIndex = 0; renderGeneral(); }

  function renderGeneral() {
    const list = filteredGeneral();
    if (!list.length) return;
    generalIndex = Math.min(generalIndex, list.length - 1);
    document.getElementById("generalQuestion").textContent = list[generalIndex].q;
    document.getElementById("generalProgress").textContent = `${generalIndex + 1} / ${list.length}`;
    document.getElementById("generalAnswer").value = "";
    document.getElementById("generalResult").classList.add("hidden");
  }

  function gradeGeneral() {
    const list = filteredGeneral();
    const q = list[generalIndex];
    const user = normalize(document.getElementById("generalAnswer").value);
    const ok = q.answers.every(group => group.some(a => user.includes(normalize(a))));
    const box = document.getElementById("generalResult");
    box.className = "general-result " + (ok ? "good" : "bad");
    box.innerHTML = ok ? `<strong>✓ 정답</strong>` : `<strong style="color:var(--bad)">✕ 오답</strong><br>${q.display}`;
    box.classList.remove("hidden");
  }

  function nextGeneral() {
    const list = filteredGeneral();
    generalIndex = (generalIndex + 1) % list.length;
    renderGeneral();
  }

  document.getElementById("generalAnswer").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gradeGeneral(); }
  });

  // -------------------------
  // 10) 초기화
  // -------------------------
  fillAreaSelect();
  updateHintButton();
  renderStudy();
  renderGeneral();
</script>
</body>
</html>
